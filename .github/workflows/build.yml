name: Build APK
on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk YouTubeCar.apk
      - uses: actions/upload-artifact@v4
        with: { name: YouTubeCar-apk, path: YouTubeCar.apk }
      - name: Publish as GitHub release asset
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" YouTubeCar.apk --title "YouTube Car $tag" \
            --notes "Built from ${{ github.sha }}" --target "${{ github.sha }}" --prerelease
