name: Build APK

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the SIGNED apk as a GitHub release (needs signing secrets)"
        type: boolean
        default: false

# No permissions by default; each job asks only for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true   # no restored cache: nothing can be planted between runs
      - name: Require dependency verification metadata
        run: test -s gradle/verification-metadata.xml
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Build (no secrets available to Gradle)
        run: ./gradlew --no-daemon assembleRelease
      - name: Manifest report (permissions and components of the built APK)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "== permissions"; "$BT/aapt2" dump permissions "$APK"
          echo "== components"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" \
            | grep -E 'E: (activity|service|receiver|provider|queries|package)|android:(name|exported|permission|networkSecurityConfig|usesCleartextTraffic|debuggable|allowBackup)\(' 
          echo "== native libs"; unzip -l "$APK" | grep -E '\.so$' || true
      - name: Sign with apksigner (only if signing secrets exist)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KS"' EXIT
          if [ -z "${KS_B64:-}" ]; then
            # No signing secrets: sign with a throwaway key so the apk is installable for personal use.
            # (A new key each run: Android won't update over an apk signed with a different key - uninstall first.)
            echo "::warning::No signing secrets: signed with a throwaway key (personal install only)."
            KS_PASS=throwaway-pass; KEY_ALIAS=throwaway; KEY_PASS=throwaway-pass
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=YouTubeCar personal build"
          else
            echo "$KS_B64" | base64 -d > "$KS"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out YouTubeCar.apk "$UNSIGNED"
          "$BT/apksigner" verify --print-certs YouTubeCar.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: sha256sum YouTubeCar*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.sign.outputs.signed == 'true' && 'YouTubeCar-signed' || 'YouTubeCar-UNSIGNED' }}
          path: YouTubeCar*.apk

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: YouTubeCar-signed   # fails (nothing is published) if the build was unsigned
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" YouTubeCar.apk --repo "${{ github.repository }}" \
            --title "YouTube Car build-${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --prerelease
